# Virtual-call tail-call trampolines: short `lwz r11,0(rX); ...; mtctr r11;
# bctr` sequences that only vtables reference, so the scanner folds them into
# the preceding function instead of emitting an entry point. An indirect call
# through one then aborts with "Call to invalid or unregistered function" at a
# perfectly plausible code address. Each host function is re-declared with an
# explicit size so the split pieces do not overlap.
#
# Regenerate by scanning for an mtctr+bctr tail call that begins right after a
# blr/bctr and lies inside an already-emitted function. Skip the XEX import
# thunk table -- its stubs are {0x01<mod><ord>, 0x02<mod><ord>, mtctr, bctr},
# match the same shape, are supplied by the SDK, and splitting them breaks the
# link with undefined sub_827888xx/sub_82789xxx symbols.
0x82160468 = { name = "sub_82160468", size = 80 }
0x821604B8 = { name = "sub_821604B8", size = 24 }
