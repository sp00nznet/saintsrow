# Saints Row (Xbox 360, 2006) - ReXGlue manifest

[project]
name = "saintsrow"
sdk_version = "0.10.0"
game_root = "../extracted"

[entrypoint]
file_path = "../extracted/default.xex"
out_directory_path = "../generated/default"

# ABI helper addresses (savegprlr/restgprlr/savefpr/restfpr/savevmx/restvmx) are
# auto-detected by 0.10.0 codegen; no setjmp/longjmp in this image.

# Manual function definitions for unresolved branch targets.
#
# C++ adjustor thunks: 8-byte `addi r3,r3,N; b target` pairs packed into
# tables. Only vtables reference them, so the scanner never sees a call and
# leaves them out of the dispatch table -- an indirect call through one then
# aborts with "Call to invalid or unregistered function".
#
# The register must be r3 (`this`). The first scan accepted any register and
# also declared jump-table case bodies (`addi r11,r11,1; b common`) and shared
# epilogue tails (`addi r1,r1,N; b __restgprlr`) as functions. That splits the
# real host function, and a loop back-edge across the split compiles to
# REX_FATAL("Unresolved branch ...") -- sub_8222F7F8 died that way. 38 such
# entries were removed on 2026-10-20.
[entrypoint.functions]
# 8-byte `li r4,N; b target` stubs packed in a vtable-only table at 0x8221EC00.
# The scanner emitted some of them and skipped their neighbours outright; these
# are the ones Player Creation calls (found by the unregistered-call log).
0x8221EC08 = { name = "sub_8221EC08", size = 8 }
0x8221EC28 = { name = "sub_8221EC28", size = 8 }
0x8221EC40 = { name = "sub_8221EC40", size = 8 }
0x8221EC48 = { name = "sub_8221EC48", size = 8 }
