# Small vtable-only functions the scanner folded into a neighbouring function.
# Each address appears in a run of >= 4 consecutive code pointers in the image (a
# vtable), starts right after a blr/bctr, and reaches its own blr/bctr within 16
# instructions with no branches -- a self-contained leaf only virtual dispatch
# reaches, so codegen never saw a call and merged it into whatever precedes it.
# Calling one aborts with "Call to invalid or unregistered function" at a
# perfectly plausible code address.
#
# A split is only safe when the host does not branch across it: reject any split
# point S where an instruction in [host, S) targets >= S or one in [S, end)
# targets < S, otherwise the two halves reference each other's labels and the
# generated code will not compile. That check rejects 193 of the 280 candidates.
# Declaring every vtable slot instead (3743 of them) splits functions mid-flow
# and breaks game init before the first frame.
